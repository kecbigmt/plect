# plect-fixture: result=invalid layer=structural diagnostic=PLECTURE-CFG-FROM-ROOT entry=definitions
# reason: an effect's outputs are production records — an inner output or this layer's locals. A live root is re-read on every evaluation, which is a task document's completion predicate.

[render]
kind  = "effect"
scope = "session"

[render.setup]
type = "exec"
bin  = "github-issue-pr"
args = ["render-instruction"]

[render.health.alive]
type = "noop"

[render.outputs.bind]
checks_status = { from = "resource.state.checks_status" }

[render.outputs_schema]
type = "object"

[render.outputs_schema.properties]
checks_status = { type = "string" }
