# plect-fixture: result=valid entry=definitions
# reason: an effect is a lifecycle-managed provider: contracts, health, an optional interactive capability, and composition.

[pane]
kind  = "effect"
scope = "run"

[pane.setup]
type = "shell"
script = '''
tmux has-session -t "$session_name" 2>/dev/null \
  || tmux new-session -d -s "$session_name" -c "$workspace_dir"
printf '{"session_name":"%s"}\n' "$session_name"
'''

[pane.setup.bind]
session_name  = { from = "session.name" }
workspace_dir = { from = "workspace.dir" }

[pane.cleanup]
type   = "shell"
script = 'tmux kill-session -t "$session_name" 2>/dev/null || true'

[pane.cleanup.bind]
session_name = { from = "self.outputs.session_name" }

[pane.health.alive]
type   = "shell"
script = 'tmux has-session -t "$session_name"'

[pane.health.alive.bind]
session_name = { from = "self.outputs.session_name" }

[pane.outputs_schema]
type     = "object"
required = ["session_name"]

[pane.outputs_schema.properties]
session_name = { type = "string" }

[pane_session]
kind = "workflow"

[[pane_session.nodes]]
uses = "pane"
