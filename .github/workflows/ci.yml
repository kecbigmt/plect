name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.6"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22.13"

jobs:
  # Core never imports plugins and plugins never import core, and both
  # sides depend only on contracts/* (scripts/check-provider-boundary.sh
  # enforces this) — that boundary, not convention, is what makes
  # scripts/ci-changed-modules.sh's trigger map safe to narrow.
  # Push events (post-merge to main) always run everything: that build is
  # the authoritative one, and there is no PR base to diff against.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      full_run: ${{ steps.decide.outputs.full_run }}
      build_test_matrix: ${{ steps.decide.outputs.build_test_matrix }}
      integration_test: ${{ steps.decide.outputs.integration_test }}
      readme_verify: ${{ steps.decide.outputs.readme_verify }}
      affected_plugins: ${{ steps.decide.outputs.affected_plugins }}
      web_ci: ${{ steps.decide.outputs.web_ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove the mapper reproduces the documented trigger map
        run: ./scripts/ci-changed-modules_selftest.sh
      - name: Prove a cross-scope rename keeps both its old and new path
        run: ./scripts/ci-diff-no-renames_selftest.sh
      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # --no-renames: default rename detection reports only the
            # destination path, so a rename across a mapped boundary (e.g.
            # app/x.go -> docs/x.md) would hide that the source side lost a
            # file. Reporting both the old and new path keeps both sides in
            # the trigger-map decision.
            out="$(git diff --no-renames --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | ./scripts/ci-changed-modules.sh)"
          else
            # No base to diff against on a direct push to main: that build is
            # the authoritative one, so run everything unconditionally.
            out="$(FORCE_FULL_RUN=true ./scripts/ci-changed-modules.sh < /dev/null)"
          fi
          echo "$out"
          full_run="$(echo "$out" | sed -n 's/^FULL_RUN=//p')"
          matrix="$(echo "$out" | sed -n 's/^BUILD_TEST_MATRIX=//p')"
          integration_test="$(echo "$out" | sed -n 's/^INTEGRATION_TEST=//p')"
          readme_verify="$(echo "$out" | sed -n 's/^README_VERIFY=//p')"
          affected_plugins="$(echo "$out" | sed -n 's/^AFFECTED_PLUGINS=//p')"
          web_ci="$(echo "$out" | sed -n 's/^WEB_CI=//p')"
          echo "full_run=$full_run" >> "$GITHUB_OUTPUT"
          echo "build_test_matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "integration_test=$integration_test" >> "$GITHUB_OUTPUT"
          echo "readme_verify=$readme_verify" >> "$GITHUB_OUTPUT"
          echo "affected_plugins=$affected_plugins" >> "$GITHUB_OUTPUT"
          echo "web_ci=$web_ci" >> "$GITHUB_OUTPUT"

  # gofmt, go-install, provider-boundary, comment-references, and
  # instruction-orphans are whole-repo invariant checks, not per-module
  # builds, so they stay unconditional: a docs-only diff still gets exactly
  # this lint set, and nothing from build-test/integration-test/readme-verify
  # below, which the changes job gates instead.
  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './app/internal/webui/*'))
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

  # app/internal/webui/webapp/embed.go commits the Vite build so go:embed
  # can see it at compile time — the invariant this job guards is that
  # building the app module never needs Node, on every PR. The changes
  # job's per-module map can route around app's own build-test entry (e.g.
  # a web/app-only change whose rebuilt dist happens to be byte-identical
  # touches nothing under app/), so this is unconditional, with no Node
  # ever installed in the job, rather than gated like build-test.
  go-install:
    name: go-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go build ./app/... from a fresh checkout, no Node installed
        run: go build ./...
        working-directory: app

  provider-boundary:
    name: provider-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Prove the vocabulary derivation handles its failure paths
        run: ./scripts/provider-vocab_selftest.sh
      - name: Prove the checker catches a seeded violation
        run: ./scripts/check-provider-boundary_selftest.sh
      - name: Check core provider-neutrality
        run: ./scripts/check-provider-boundary.sh
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Prove the SQLite driver boundary checker catches a seeded requirement
        run: ./scripts/check-sqlite-driver-boundary_selftest.sh
      - name: Check the SQLite driver stays out of contracts/ and plugins/ build lists
        run: ./scripts/check-sqlite-driver-boundary.sh

  comment-references:
    name: comment-references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove the checker catches a seeded violation
        run: ./scripts/check-comment-references_selftest.sh
      - name: Check comments for issue/PR/ADR number references
        run: ./scripts/check-comment-references.sh

  instruction-orphans:
    name: instruction-orphans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Prove the checker catches a seeded orphaned sidecar
        run: ./scripts/check-instruction-orphans_selftest.sh
      - name: Check every task instruction sidecar is referenced
        run: ./scripts/check-instruction-orphans.sh

  gh-guard:
    name: gh-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove the gh_guard shim denies merge/close and passes through everything else
        run: ./scripts/gh-guard_selftest.sh

  gh-app-guard:
    name: gh-app-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove the gh_app_guard shim mints before allow, denies before mint, and scopes GH_TOKEN to the delegated gh
        run: ./scripts/gh-app-guard_selftest.sh

  # The schema-contract decision record under docs/adr/ requires CI to
  # check schema compilation, reproducible Go/TypeScript generation, and
  # generated-code compilation — this job is that check.
  # Gated on WEB_CI (web/api/** or its app/internal/webapi/** consumer) so a
  # PR touching neither doesn't pay for a pnpm install; a frozen-reference
  # change under docs/design/web-ui/prototype/** alone leaves WEB_CI false,
  # so it cannot stand in for validating the production contract.
  web-api-contract:
    name: web-api-contract
    needs: changes
    if: needs.changes.outputs.web_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Not corepack: corepack enable's own package-manager download path
      # currently fails signature verification against npm's registry
      # ("Cannot find matching keyid"), independent of this repo. `npm
      # install -g` uses npm's own, unrelated package-integrity check, and
      # npm ships with actions/setup-node above — no new tool dependency.
      # The version comes from package.json's own packageManager field
      # rather than being retyped here, so the two cannot drift apart.
      - name: Install the pnpm version pinned in web/package.json
        run: npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
        working-directory: web
      # One lockfile at the workspace root covers both web/api and web/app.
      - name: pnpm install (workspace-wide)
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Regenerate OpenAPI + TypeScript and check for drift
        run: |
          pnpm generate
          git diff --exit-code -- generated/ || {
            echo "::error::web/api/generated/ is out of date; run 'pnpm generate' in web/api and commit the result." >&2
            exit 1
          }
        working-directory: web/api
      - name: Type-check and run the fixture round-trip script
        run: pnpm verify
        working-directory: web/api
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Regenerate Go types and check for drift
        run: |
          go tool oapi-codegen -config oapi-codegen.yaml ../../../web/api/generated/openapi.yaml
          git diff --exit-code -- generated/ || {
            echo "::error::app/internal/webapi/generated/ is out of date; run 'go generate ./internal/webapi/...' in app and commit the result." >&2
            exit 1
          }
        working-directory: app/internal/webapi

  # The client/server boundary ADR requires no Node at runtime and
  # reproducible CI; app/internal/webui/webapp/embed.go commits the Vite
  # build for exactly that reason (go:embed only sees what's present at
  # compile time, and go install has no path to run pnpm build). This job is
  # the reproducibility check for that committed build, mirroring
  # web-api-contract's own generated-code drift check. Gated on WEB_CI for
  # the same reason web-api-contract is: a frozen-reference-only change
  # under docs/design/web-ui/prototype/** must not stand in for validating
  # this production build.
  web-app-build:
    name: web-app-build
    needs: changes
    if: needs.changes.outputs.web_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the pnpm version pinned in web/package.json
        run: npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
        working-directory: web
      - name: pnpm install (workspace-wide)
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Unit tests (vitest)
        run: pnpm test
        working-directory: web/app
      - name: Build and check for drift against the committed embed
        run: |
          pnpm build
          git diff --exit-code -- ../../app/internal/webui/webapp/dist/ || {
            echo "::error::app/internal/webui/webapp/dist/ is out of date; run 'pnpm build' in web/app and commit the result." >&2
            exit 1
          }
        working-directory: web/app
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go test ./internal/webui/...
        run: go test ./internal/webui/...
        working-directory: app

  # This job covers the script-side half of a plugin's delivery contract;
  # its argv side is pinned by the channel-invocation records the
  # integration-test job regenerates from the shipped declarations. It is
  # scoped to the plugins the changes job flagged, since one plugin's
  # change must not run another plugin's selftests.
  plugin-script-selftests:
    name: plugin-script-selftests
    needs: changes
    if: needs.changes.outputs.affected_plugins != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove the runner isolates one plugin's selftests from another's
        run: ./scripts/run-plugin-selftests_selftest.sh
      - name: Run each affected plugin's script selftests
        env:
          REQUIRE_FOUND: ${{ needs.changes.outputs.full_run }}
        run: |
          mapfile -t names < <(jq -r '.[]' <<< '${{ needs.changes.outputs.affected_plugins }}')
          ./scripts/run-plugin-selftests.sh "${names[@]}"

  # The two standing checks docs/design/sqlite-persistence.md's toolchain
  # slice requires: (1) here, that regenerating the goose migration from
  # schema.sql via Atlas CE and regenerating sqlc's Go output from
  # schema.sql/queries.sql produce no diff, so the committed artifacts
  # cannot silently drift from their declarative sources. (2) declaration
  # equivalence — that applying the migration history reproduces the same
  # structure schema.sql declares, excluding goose's own bookkeeping table
  # — is TestSchemaSQL_MatchesMigrationHistory, which already runs in every
  # build-test (app) job below; it needs no external tool, so it gets no
  # separate job here.
  sqlite-persistence-generation:
    name: sqlite-persistence-generation
    needs: changes
    if: contains(needs.changes.outputs.build_test_matrix, '"app"')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # Pinned by exact release + the community (Apache-2.0) binary's own
      # SHA-256, not `curl https://atlasgo.sh | sh`: see this package's
      # doc.go for why the community binary specifically, and the per-platform
      # checksums for developers on other operating systems.
      - name: Fetch and verify the pinned Atlas Community Edition binary
        run: |
          curl -sSL -o atlas https://release.ariga.io/atlas/atlas-community-linux-amd64-v1.3.0
          echo "10d7913e3dce43ab99b8d71534a4cbadaf11a16dc293adf3b91d10e83a0ac70b  atlas" | sha256sum -c -
          chmod +x atlas
        working-directory: app/internal/persistence
      - name: Regenerate the migration history from schema.sql and check for drift
        run: |
          ./atlas migrate diff regen_check \
            --dir "file://migrations" \
            --dir-format goose \
            --to "file://schema.sql" \
            --dev-url "sqlite://file?mode=memory&cache=shared"
          rm -f atlas
          git diff --exit-code -- migrations/ schema.sql || {
            echo "::error::app/internal/persistence/migrations (or schema.sql) is out of date; see doc.go for the regeneration command, and commit the result." >&2
            exit 1
          }
        working-directory: app/internal/persistence
      - name: Regenerate sqlc's generated Go and check for drift
        run: |
          go generate ./internal/persistence/...
          git diff --exit-code -- internal/persistence/sqlcgen/ || {
            echo "::error::app/internal/persistence/sqlcgen is out of date; run 'go generate ./internal/persistence/...' in app and commit the result." >&2
            exit 1
          }
        working-directory: app

  build-test:
    name: build-test (${{ matrix.module }})
    needs: changes
    # An empty matrix produces zero job instances (shown as skipped, not
    # failed, in gh pr checks) rather than an error.
    if: needs.changes.outputs.build_test_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.changes.outputs.build_test_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go build
        run: go build ./...
        working-directory: ${{ matrix.module }}
      - name: go vet
        run: go vet ./...
        working-directory: ${{ matrix.module }}
      - name: go test
        run: go test ./...
        working-directory: ${{ matrix.module }}

  integration-test:
    name: integration-test
    needs: changes
    if: needs.changes.outputs.integration_test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # The integration-tagged tests (app/internal/service, app/internal/webui)
      # spin up real git repos and worktrees and, for the shipped
      # workspace-provider cases, build the plect/github-worktree/
      # github-watcher binaries (from plugins/github/src) under test — that's
      # slow enough to be excluded from the default
      # go test run but is exactly the coverage that would otherwise let a
      # spec-encoding test like TestIntegration_DestroyRefusesWhenWorkspaceDirDirty
      # rot unnoticed.
      - name: go test -tags integration
        run: go test -tags integration ./...
        working-directory: app
      - name: go vet -tags integration
        run: go vet -tags integration ./...
        working-directory: app

  readme-verify:
    name: readme-verify
    needs: changes
    if: needs.changes.outputs.readme_verify == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run README build commands
        run: |
          go build ./app/...
          go build ./contracts/atomicfile/...
          go build ./contracts/channel-protocol/...
          go build ./contracts/event/...
          go build ./contracts/state/...
          go build ./plugins/claude/src/channel-server/...
          go build ./plugins/github/src/...
          go build ./plugins/legacy-migration/...
          go build ./plugins/okf/src/...
          go build ./plugins/slack/src/slack-adapter/...
      - name: Run README test commands
        run: |
          go test ./app/...
          go test ./contracts/atomicfile/...
          go test ./contracts/channel-protocol/...
          go test ./contracts/event/...
          go test ./contracts/state/...
          go test ./plugins/claude/src/channel-server/...
          go test ./plugins/github/src/...
          go test ./plugins/legacy-migration/...
          go test ./plugins/okf/src/...
          go test ./plugins/slack/src/slack-adapter/...

  # The only job a branch-protection ruleset can require without going
  # BLOCKED forever on a path-filtered PR: matrix jobs above report nothing
  # when skipped by the changes job, and GitHub's required-status-check
  # semantics treat a never-reporting required context as forever-pending.
  # if: always() plus needs on every other job makes this the one context
  # that always reports, so the ruleset can require it alone and still
  # cover the full matrix.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - changes
      - gofmt
      - go-install
      - provider-boundary
      - comment-references
      - instruction-orphans
      - gh-guard
      - web-api-contract
      - web-app-build
      - plugin-script-selftests
      - sqlite-persistence-generation
      - build-test
      - integration-test
      - readme-verify
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed job to have succeeded or been skipped
        # The needs context is passed via env, not spliced into the script
        # body, because needs.*.outputs can carry diff-derived strings (e.g.
        # affected_plugins) that a malicious PR could shape to break out of
        # an inline interpolation.
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS_CONTEXT" | jq -e '
            to_entries | all(.value.result == "success" or .value.result == "skipped")
          '
