# Copy this into a user-owned config layer and adjust the runtime/provider
# choices for the review workflow that should discuss conclusions in Slack.
#
# slack_thread itself knows nothing about reviews: it just opens a thread for
# whatever root_text it is handed. The review framing — composing that text
# from a PR title, URL, and head sha — lives here, in the workflow that wants
# it.

[pr_review_with_slack]
kind               = "workflow"
workspace_provider = "official.github.worktree"

[pr_review_with_slack.inputs_schema]
type                 = "object"
required             = ["slack_base_url", "slack_channel_id", "pr_title", "pr_url", "head_sha"]
additionalProperties = false

[pr_review_with_slack.inputs_schema.properties]
slack_base_url   = { type = "string" }
slack_channel_id = { type = "string" }
pr_title         = { type = "string" }
pr_url           = { type = "string" }
head_sha         = { type = "string" }

[[pr_review_with_slack.nodes]]
id   = "slack_thread"
uses = "official.slack.slack_thread"

[pr_review_with_slack.nodes.inputs]
base_url   = { from = "session.inputs.slack_base_url" }
channel_id = { from = "session.inputs.slack_channel_id" }
# The end bound is clamped with size(): unlike `cut -c 1-12`, CEL's
# substring(start, end) errors once end exceeds the operand's own length.
root_text  = { expr = "'[AI review] ' + session.inputs.pr_title + ' — ' + session.inputs.pr_url + '\\nsession ' + session.name + ' · head ' + session.inputs.head_sha.substring(0, session.inputs.head_sha.size() < 12 ? session.inputs.head_sha.size() : 12)" }

[[pr_review_with_slack.nodes]]
id   = "reviewer"
uses = "official.codex.codex"

[[pr_review_with_slack.event.channel]]
name    = "review_conclusion"
uses    = "official.slack.slack"
include = ["plect.judge.recorded"]

[pr_review_with_slack.event.channel.inputs]
base_url   = { from = "session.inputs.slack_base_url" }
channel_id = { from = "nodes.slack_thread.outputs.channel_id" }
thread_ts  = { from = "nodes.slack_thread.outputs.thread_ts" }

[[pr_review_with_slack.event.channel]]
name    = "thread_status"
uses    = "official.slack.status"
include = ["plect.status_message", "plect.node.result"]

# No per-event `status`/`text` input here: an [event.channel.inputs] binding
# resolves from session/node outputs only (the same surface a node's own
# inputs read), with no `event` root — so a workflow cannot branch on the
# delivered event's own content at this binding site. The `status` channel
# itself carries the event's body-or-summary verbatim into the thread's
# status line (see channels/status.toml), so a `plect.status_message` event
# with an empty body and summary clears the thread's status, and a
# `plect.node.result` event surfaces a node's setup/cleanup/liveness outcome
# there the same way.
[pr_review_with_slack.event.channel.inputs]
base_url   = { from = "session.inputs.slack_base_url" }
channel_id = { from = "nodes.slack_thread.outputs.channel_id" }
thread_ts  = { from = "nodes.slack_thread.outputs.thread_ts" }
