# Both permalink forms resolve to the same session because `name` prefers
# the reply form's `thread_ts` query capture, dot stripped via CEL's
# `replace`, and falls back to the root form's already-digit-only `ts16`
# path capture; a capture unmatched under the branch a given permalink took
# is present in `match` as the empty string, not absent, which is what
# makes that fallback safe rather than an unresolved-root error.
#
# No `subscribe`/`unsubscribe`: this plugin owns no watcher a session could
# bind to or drop a binding from for a thread resource.
[thread_workspace]
kind  = "workspace_provider"
match = '^https://[A-Za-z0-9.-]+\.slack\.com/archives/(?P<channel_id>[A-Z0-9]+)/p(?P<ts16>\d{16})(?:\?thread_ts=(?P<thread_ts>\d{10}\.\d{6})&cid=[A-Z0-9]+)?$'
name  = { expr = "'slack/' + match.channel_id + '-' + (match.thread_ts != '' ? match.thread_ts.replace('.', '') : match.ts16)" }

# `setup` has no `match` root — it runs once a session already exists, past
# the point `name` resolved it — so it recovers channel_id and the root
# timestamp by re-parsing `permalink`, the same string `match` parsed to
# build `session.name` in the first place, rather than splitting
# `session.name` itself. `session.name` carries a trailing `+<workflow-id>`
# appended after resolution, which a positional slice of it can't tell apart
# from the digits it's after; `permalink` carries no such suffix.
[thread_workspace.setup]
type = "shell"
script = '''
set -eu

# workspace_dirs_root is operator config, not something this file's own
# regex constrains, so it cannot be assumed JSON-safe the way a `match`
# capture is. Escaping it by hand, rather than reaching for jq, keeps this
# hook's dependencies at plect and a POSIX shell.
json_escape() {
  value=$1
  ctrl=$(printf '\001\002\003\004\005\006\007\010\011\012\013\014\015\016\017\020\021\022\023\024\025\026\027\030\031\032\033\034\035\036\037')
  out=
  while [ -n "$value" ]; do
    case $value in
      *[\\\"$ctrl]*)
        prefix=${value%%[\\\"$ctrl]*}
        rest=${value#"$prefix"}
        char=${rest%"${rest#?}"}
        case $char in
          '\') repl='\\' ;;
          '"') repl='\"' ;;
          *) repl="\\u00$(printf '%02x' "'$char")" ;;
        esac
        out="$out$prefix$repl"
        value=${rest#?}
        ;;
      *)
        out="$out$value"
        value=
        ;;
    esac
  done
  printf '%s' "$out"
}

# Same shape `match` requires, walked by parameter expansion instead of a
# second regex engine call: .../archives/<channel_id>/p<ts16> optionally
# followed by ?thread_ts=<root-ts>&cid=<channel_id>.
rest=${permalink#*://}
rest=${rest#*/archives/}
channel_id=${rest%%/*}
rest=${rest#*/p}
ts16=${rest%%\?*}
if [ "$rest" != "$ts16" ]; then
  query=${rest#*\?}
  thread_ts=${query#thread_ts=}
  thread_ts=${thread_ts%%&*}
else
  thread_ts=""
fi
if [ -z "$thread_ts" ]; then
  thread_ts="${ts16%??????}.${ts16#??????????}"
fi

workspace_dir="$workspace_dirs_root/slack/$channel_id/$thread_ts"
mkdir -p "$workspace_dir"

printf '{"workspace_dir":"%s","channel_id":"%s","thread_ts":"%s","permalink":"%s"}\n' \
  "$(json_escape "$workspace_dir")" "$(json_escape "$channel_id")" \
  "$(json_escape "$thread_ts")" "$(json_escape "$permalink")"
'''

[thread_workspace.setup.bind]
permalink           = { from = "resource.id" }
workspace_dirs_root = { from = "config.workspace_dirs_root" }

[thread_workspace.cleanup]
type   = "shell"
script = 'rm -rf "$workspace_dir"'

[thread_workspace.cleanup.bind]
workspace_dir = { from = "self.outputs.workspace_dir" }

[thread_workspace.outputs_schema]
type     = "object"
required = ["workspace_dir", "channel_id", "thread_ts", "permalink"]

[thread_workspace.outputs_schema.properties.workspace_dir]
type = "string"

[thread_workspace.outputs_schema.properties.channel_id]
type = "string"

[thread_workspace.outputs_schema.properties.thread_ts]
type = "string"

[thread_workspace.outputs_schema.properties.permalink]
type = "string"
