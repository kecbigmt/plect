# Channel: render a plect.message_delta chunk sequence as one live-updating
# Slack thread reply via this plugin's slack-adapter service (see this
# plugin's src/slack-adapter and its [[services]] declaration in
# plugin.toml) over that service's POST /stream. Mirrors channels/slack.toml's
# exec/escaping shape; only the endpoint and payload differ. No `include`
# default — plect.message_delta is a specific event shape (an emitter's
# streamed reply), and the composing workflow decides whether to wire it
# here.
#
# index and final are declared as strings, not integer/boolean: they
# originate as plect.message_delta metadata, which is always a string (see
# contracts/event), and this channel passes inputs through verbatim rather
# than requiring every composing workflow to convert them first. The
# adapter parses them on receipt.
[stream]
kind    = "channel"
type    = "exec"
command = "curl"
args = [
  "-sf",
  "--max-time",
  "10",
  "-X",
  "POST",
  { expr = "inputs.base_url + '/stream'" },
  "-H",
  "Content-Type: application/json",
  "-d",
  { json = { thread_ts = { from = "inputs.thread_ts" }, channel_id = { from = "inputs.channel_id" }, stream_key = { from = "inputs.stream_key" }, text = { from = "inputs.text" }, index = { from = "inputs.index" }, final = { from = "inputs.final" } } },
]
timeout = "10s"

[stream.input_schema]
base_url   = { type = "string", required = true }
channel_id = { type = "string", required = true }
thread_ts  = { type = "string", required = true }
stream_key = { type = "string", required = true }
text       = { type = "string", required = true }
index      = { type = "string", required = true }
final      = { type = "string", required = true }
