# Channel: render a plect.message_delta chunk sequence, and any plect.message
# not already covered by one, as one live-updating Slack thread reply via
# slack-adapter's POST /stream (src/slack-adapter). stream_key/text/index/
# final are bound from the delivered event's own fields: an [[event.channel]]
# `inputs` binding has no access to the event being delivered
# (docs/language/values.md), so only this channel's own action can. index/
# final default to "0"/"true" since a plect.message carries no chunk
# sequence of its own.

# This channel runs unconditionally (an exec action always runs), so a
# plect.message whose deltas already closed the same channel/thread/message
# identity is posted through here too; StreamManager is what keeps that from
# becoming a second Slack message (its own doc comment,
# src/slack-adapter/internal/adapter/stream.go).
[stream]
kind    = "channel"
type    = "exec"
command = "curl"
args = [
  "-sf",
  "--max-time",
  "10",
  "-X",
  "POST",
  { expr = "inputs.base_url + '/stream'" },
  "-H",
  "Content-Type: application/json",
  "-d",
  { json = { thread_ts = { from = "inputs.thread_ts" }, channel_id = { from = "inputs.channel_id" }, stream_key = { from = "event.metadata.message_id", default = "" }, text = { from = "event.body" }, index = { expr = "has(event.metadata.index) ? event.metadata.index : '0'" }, final = { expr = "has(event.metadata.final) ? event.metadata.final : 'true'" } } },
]
timeout = "10s"

[stream.input_schema]
base_url   = { type = "string", required = true }
channel_id = { type = "string", required = true }
thread_ts  = { type = "string", required = true }
