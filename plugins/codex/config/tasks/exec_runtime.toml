[exec_runtime]
kind  = "effect"
scope = "run"

# Inputs:
#   model        — when set, exported as CODEX_MODEL so the worker appends
#                  `-m <value>` to every `codex exec`/`codex exec resume`
#                  call. Empty = codex's own config default. Restricted to a
#                  plain-token charset (see inputs_schema below) because it
#                  reaches the pane's shell as keystrokes.
#   effort       — when set, exported as CODEX_MODEL_REASONING_EFFORT so the
#                  worker appends `-c model_reasoning_effort=<value>` the
#                  same way. Empty = codex's own config default. Same
#                  restriction as model.
#   launch_env   — when set, a JSON object of environment variables exported
#                  on the launch line, so the agent process inherits them.
#                  Data only: keys must be valid environment variable names
#                  and values are shell-quoted, so nothing here can add a
#                  command to what gets launched.
#   state_root   — when set, the directory the worker's per-session queue and
#                  state live under. Empty = a temporary directory, which a
#                  reboot or a tmp sweep may reclaim; a workflow that wants
#                  the queue to survive that names a durable root here.
#   path_prepend — when set, a directory prepended to this session's PATH.
#                  Generic by design (docs/design/plugin-boundary-contracts.md's
#                  GitHub CLI Guard section): this plugin carries no
#                  GitHub-specific guard switch of its own. A workflow that
#                  wants the write guard wires this from the github plugin's
#                  own gh_guard effect output.
#   launch_timeout — when set, how long setup waits for the worker to signal
#                  readiness before giving up, as a plain "<seconds>s" token
#                  (e.g. "180s"). Default 120s. A cold pane can take well
#                  over a fixed short window to start the worker even though
#                  it did come up, so raise this rather than treat a
#                  live-but-slow launch as a failure.
#
# codex_exec starts a headless worker (codex-exec-worker) instead of the
# interactive Codex TUI, so instruction delivery is a queued `codex exec`/
# `codex exec resume` call rather than terminal keystrokes — the
# submit-race and boot-race classes that motivate this plugin's
# terminal_submit channel and initial_prompt effect do not exist for a
# runtime with no input box.
[exec_runtime.setup]
type   = "shell"
script = '''
# The reset drops any record a previous run left behind, so this run's
# activity probe reports "no basis yet" until this run's first turn boundary
# rather than inheriting a stale fingerprint.
"$activity_bin" reset "$session_name"

CODEX_HOME_DIR="${CODEX_HOME:-$HOME/.codex}"
mkdir -p "$CODEX_HOME_DIR"
PROFILE_NAME="plect-$(uuidgen)"
PROFILE_PATH="$CODEX_HOME_DIR/$PROFILE_NAME.config.toml"
cat > "$PROFILE_PATH" <<HOOKS_TOML
bypass_hook_trust = true

[hooks]
UserPromptSubmit = [{type = "command", command = ["$activity_bin", "working"]}]
Stop = [{type = "command", command = ["$activity_bin", "waiting"]}]
HOOKS_TOML

STATE_ROOT="${state_root-}"
[ -n "$STATE_ROOT" ] || STATE_ROOT="${TMPDIR:-/tmp}/plect-codex-exec"
STATE_DIR="$STATE_ROOT/$session_name"
QUEUE_DIR="$STATE_DIR/queue"
mkdir -p "$QUEUE_DIR"

# A resumed session keeps its queue/state dir and thread_id file — the
# worker just needs restarting, not reseeding.
PREV_STATE_DIR="${prev_state_dir-}"
[ -n "$PREV_STATE_DIR" ] && [ "$PREV_STATE_DIR" != "$STATE_DIR" ] && STATE_DIR="$PREV_STATE_DIR" && QUEUE_DIR="$STATE_DIR/queue"

EXPORTS="export PLECT_SESSION_NAME=$session_name; "
# The worker script runs standalone, outside plect's own resolution, so it
# can't resolve a bin reference itself for its own activity-hook calls;
# hand the resolved path down as an env var instead.
EXPORTS="${EXPORTS}export PLECT_AGENT_ACTIVITY_BIN='$activity_bin'; "

# launch_env crosses one boundary the binding transport does not close: the
# keystrokes sent to the pane. jq's @sh closes it by quoting each value, and
# the key test rejects anything that is not an environment variable name — an
# unquoted or oddly-named key is the only way a data-shaped parameter could
# turn into a command.
LAUNCH_ENV="${launch_env-}"
if [ -n "$LAUNCH_ENV" ]; then
  LAUNCH_EXPORTS=$(printf '%s' "$LAUNCH_ENV" | jq -er '
    to_entries
    | map(if (.key | test("^[A-Za-z_][A-Za-z0-9_]*$")) then .
          else error("launch_env key \(.key) is not a valid environment variable name") end)
    | map("export \(.key)=\(.value | tostring | @sh); ")
    | add // ""') || exit 1
  EXPORTS="${EXPORTS}${LAUNCH_EXPORTS}"
fi

PATH_PREPEND="${path_prepend-}"
[ -n "$PATH_PREPEND" ] && EXPORTS="${EXPORTS}export PATH=$PATH_PREPEND:\$PATH; "
# model/effort reach the pane's shell as keystrokes, which is what the
# inputs_schema pattern below closes: it rejects anything but a plain token,
# so neither can carry a quote or a newline into the command line the pane's
# shell parses. The single quotes here are the redundant defense on top.
MODEL="${model-}"
[ -n "$MODEL" ] && EXPORTS="${EXPORTS}export CODEX_MODEL='$MODEL'; "
EFFORT="${effort-}"
[ -n "$EFFORT" ] && EXPORTS="${EXPORTS}export CODEX_MODEL_REASONING_EFFORT='$EFFORT'; "

rm -f "$STATE_DIR/ready" "$STATE_DIR/worker.pid"
# No `exec`: the worker runs as a child of the pane's own shell, the same
# shape the interactive `codex` effect uses for its TUI, so killing it to
# abandon a stuck launch leaves the pane's own root process — and the
# multiplexer session behind it, a produced record this plugin does not own
# the lifecycle of — alone. The worker is a bash script, so its comm is
# "bash" regardless of which script bash is running; it writes its own pid
# to worker.pid for this reason, the same way this plugin's `codex` effect
# discovers its agent's pid by reading a file the agent itself writes.
#
# The terminal verbs compose against whichever effect in this workflow
# declares the interactive endpoint — never a concrete multiplexer named
# here directly.
sh -c "$send_text" terminal-send-text "${EXPORTS}$worker_bin '$QUEUE_DIR' '$STATE_DIR' '$PROFILE_NAME'"
sh -c "$send_keys" terminal-send-keys Enter

PANE_PID=$(sh -c "$terminal_pid" terminal-pid)
READY_TIMEOUT_SECONDS="${launch_timeout%s}"
PID=""
READY=0
for _ in $(seq 1 $((READY_TIMEOUT_SECONDS * 2))); do
  sleep 0.5
  kill -0 "$PANE_PID" 2>/dev/null || continue
  [ -z "$PID" ] && [ -s "$STATE_DIR/worker.pid" ] && PID=$(cat "$STATE_DIR/worker.pid")
  [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null && [ -f "$STATE_DIR/ready" ] && READY=1 && break
done
if [ "$READY" -ne 1 ]; then
  echo "codex-exec worker not ready within ${launch_timeout} under pane pid $PANE_PID" >&2
  # The worker is a child of the pane's shell, not the pane's root process,
  # so terminating it leaves the pane itself alive and usable for the retry
  # this failure is about to trigger.
  if [ -n "$PID" ]; then
    kill -TERM "$PID" 2>/dev/null
    for _ in 1 2 3 4 5; do
      sleep 0.5
      kill -0 "$PID" 2>/dev/null || break
    done
    kill -KILL "$PID" 2>/dev/null || true
  fi
  exit 1
fi

jq -nc \
  --argjson pid "$PID" \
  --arg queue_dir "$QUEUE_DIR" \
  --arg state_dir "$STATE_DIR" \
  --arg profile "$PROFILE_PATH" \
  '{pid:$pid, queue_dir:$queue_dir, state_dir:$state_dir, profile_path:$profile}'
'''

[exec_runtime.setup.bind]
session_name   = { from = "session.name" }
model          = { from = "inputs.model", optional = true }
effort         = { from = "inputs.effort", optional = true }
launch_env     = { from = "inputs.launch_env", optional = true }
state_root     = { from = "inputs.state_root", optional = true }
path_prepend   = { from = "inputs.path_prepend", optional = true }
launch_timeout = { from = "inputs.launch_timeout", default = "120s" }
prev_state_dir = { from = "prev.state_dir", optional = true }
activity_bin   = { bin = "codex-agent-activity" }
worker_bin     = { bin = "codex-exec-worker" }
send_text      = { terminal = "send_text" }
send_keys      = { terminal = "send_keys" }
terminal_pid   = { terminal = "pid" }

[exec_runtime.cleanup]
type   = "shell"
script = '''
kill -TERM "$pid" 2>/dev/null || exit 0
for _ in 1 2 3 4 5; do
  sleep 0.5
  kill -0 "$pid" 2>/dev/null || break
done
kill -KILL "$pid" 2>/dev/null || true
[ -n "${profile_path-}" ] && rm -f "$profile_path"
"$activity_bin" reset "$session_name"
true
'''

[exec_runtime.cleanup.bind]
pid          = { from = "self.outputs.pid", optional = true }
profile_path = { from = "self.outputs.profile_path", optional = true }
session_name = { from = "session.name" }
activity_bin = { bin = "codex-agent-activity" }

# A live PID alone would hide a worker stuck on a permanently-failing turn.
# health.json is absent until the first turn finishes, which is healthy —
# nothing has failed yet.
[exec_runtime.health.alive]
type   = "shell"
script = '''
kill -0 "$pid" || exit 1
HEALTH="$state_dir/health.json"
[ -f "$HEALTH" ] || exit 0
jq -e ".last_exit_code == 0" "$HEALTH" >/dev/null
'''

[exec_runtime.health.alive.bind]
pid       = { from = "self.outputs.pid" }
state_dir = { from = "self.outputs.state_dir" }

# activity reads back the record the same turn-boundary hooks this setup
# registers write, so hook and probe are two halves of one fingerprint
# format. Unlike the interactive shape there is no pane to fingerprint here,
# so state_dir is passed through too: a turn's own log file (one per turn,
# growing as codex streams to it, never touching the pane) is this runtime's
# only evidence for a turn still running long enough to outlast the
# stall_threshold before its own Stop hook ever fires.
[exec_runtime.health.activity]
type = "exec"
bin  = "codex-agent-activity"
args = ["probe", { from = "session.name" }, { from = "self.outputs.state_dir" }]

[exec_runtime.inputs_schema]
type                 = "object"
additionalProperties = false

# model/effort: restricted to a plain-token charset (no quotes, whitespace,
# or newlines) because they reach the pane's shell as keystrokes — see the
# setup script's comment above.
[exec_runtime.inputs_schema.properties]
model        = { type = "string", pattern = "^[A-Za-z0-9_.:-]*$" }
effort       = { type = "string", pattern = "^[A-Za-z0-9_.:-]*$" }
# launch_env: a JSON object. jq rejects anything that is not an object of
# scalars at launch time and quotes each value on its way into the
# keystrokes; the quote-free charset is the defense in depth behind that,
# since the keystrokes are a boundary the binding transport does not own.
launch_env   = { type = "string", pattern = "^[^']*$" }
# state_root: a plain path charset, same keystroke boundary and same
# reasoning as path_prepend below.
state_root   = { type = "string", pattern = "^[A-Za-z0-9_./:-]*$" }
# path_prepend: a plain path charset (no quotes, whitespace, or shell
# metacharacters), same reasoning as model/effort above.
path_prepend = { type = "string", pattern = "^[A-Za-z0-9_./:-]*$" }
# launch_timeout: restricted to digits-plus-"s" so the setup script can strip
# the suffix and use the result directly in shell arithmetic — no separate
# duration parser needed, and no non-numeric value can reach $(( )). The
# effective default of 120s is applied by this effect's own setup.bind
# (`default = "120s"` on the launch_timeout binding), not by this key.
launch_timeout = { type = "string", pattern = "^[1-9][0-9]*s$", default = "120s" }

[exec_runtime.outputs_schema]
type     = "object"
required = ["pid", "queue_dir", "state_dir"]

[exec_runtime.outputs_schema.properties]
pid          = { type = "integer" }
queue_dir    = { type = "string" }
state_dir    = { type = "string" }
profile_path = { type = "string" }
