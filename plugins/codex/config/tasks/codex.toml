[codex]
kind  = "effect"
scope = "run"

# Inputs:
#   model        — when set, appended to every launch as `-m <value>`. Empty
#                  = codex's own config default. Restricted to a plain-token
#                  charset (see inputs_schema) since it reaches the pane's
#                  shell as keystrokes.
#   effort       — when set, appended as `-c model_reasoning_effort=<value>`.
#                  Empty = codex's own config default. Same restriction.
#   launch_env   — when set, a JSON object of environment variables exported
#                  on the launch line, so the agent process inherits them.
#                  Data only: keys must be valid environment variable names
#                  and values are shell-quoted, so nothing here can add a
#                  command to what gets launched.
#   path_prepend — when set, a directory prepended to this session's PATH.
#                  Generic by design (docs/design/plugin-boundary-contracts.md's
#                  GitHub CLI Guard section): this plugin carries no
#                  GitHub-specific guard switch of its own. A workflow that
#                  wants the write guard wires this from the github plugin's
#                  own gh_guard effect output.
#   launch_timeout — when set, how long each launch-detection wait (the pane
#                  process appearing, then the TUI clearing its boot banner)
#                  gives itself before giving up, as a plain "<seconds>s"
#                  token (e.g. "180s"). Default 120s. A cold pane can take
#                  well over a fixed short window to start and settle even
#                  though codex itself did come up, so raise this rather than
#                  treat a live-but-slow launch as a failure.
#
# Codex CLI does not expose a Claude Code-style channel-server transport.
# This effect therefore only starts the interactive Codex TUI in tmux and
# lets plect manage its process lifecycle.
[codex.setup]
type   = "shell"
script = '''
# agent_activity self-report hooks: UserPromptSubmit/Stop call
# codex-agent-activity, fire-and-forget by design. Hook registration is
# written to a per-session codex profile file, not assembled as a `-c` value
# on the launch command: the JSON-in-CLI-arg form gets mangled once relayed
# through the terminal (shell quoting breaks in transit), so nothing
# hook-related rides the command line here. `bypass_hook_trust` moves into
# the profile file too, alongside the hooks table, since it's just a config
# key.
#
# The reset drops any record a previous run left behind, so this run's
# activity probe reports "no basis yet" until this run's first turn boundary
# rather than inheriting a stale fingerprint.
"$activity_bin" reset "$session_name"

CODEX_HOME_DIR="${CODEX_HOME:-$HOME/.codex}"
mkdir -p "$CODEX_HOME_DIR"
PROFILE_NAME="plect-$(uuidgen)"
PROFILE_PATH="$CODEX_HOME_DIR/$PROFILE_NAME.config.toml"
cat > "$PROFILE_PATH" <<HOOKS_TOML
bypass_hook_trust = true

[hooks]
UserPromptSubmit = [{type = "command", command = ["$activity_bin", "working"]}]
Stop = [{type = "command", command = ["$activity_bin", "waiting"]}]
HOOKS_TOML

MODEL="${model-}"
MODEL_FLAG=""
[ -n "$MODEL" ] && MODEL_FLAG="-m $MODEL"
EFFORT="${effort-}"
EFFORT_FLAG=""
[ -n "$EFFORT" ] && EFFORT_FLAG="-c model_reasoning_effort=$EFFORT"

PREV_SID="${prev_session_id-}"
if [ -n "$PREV_SID" ]; then
  CODEX_CMD="codex resume --dangerously-bypass-approvals-and-sandbox --profile $PROFILE_NAME $MODEL_FLAG $EFFORT_FLAG $PREV_SID"
else
  CODEX_CMD="codex --dangerously-bypass-approvals-and-sandbox --profile $PROFILE_NAME $MODEL_FLAG $EFFORT_FLAG"
fi

# Runtime plect commands use this as their current session and as the default
# parent when they dispatch child sessions.
EXPORTS="export PLECT_SESSION_NAME=$session_name; "

# launch_env crosses one boundary the binding transport does not close: the
# keystrokes sent to the pane. jq's @sh closes it by quoting each value, and
# the key test rejects anything that is not an environment variable name — an
# unquoted or oddly-named key is the only way a data-shaped parameter could
# turn into a command.
LAUNCH_ENV="${launch_env-}"
if [ -n "$LAUNCH_ENV" ]; then
  LAUNCH_EXPORTS=$(printf '%s' "$LAUNCH_ENV" | jq -er '
    to_entries
    | map(if (.key | test("^[A-Za-z_][A-Za-z0-9_]*$")) then .
          else error("launch_env key \(.key) is not a valid environment variable name") end)
    | map("export \(.key)=\(.value | tostring | @sh); ")
    | add // ""') || exit 1
  EXPORTS="${EXPORTS}${LAUNCH_EXPORTS}"
fi

PATH_PREPEND="${path_prepend-}"
[ -n "$PATH_PREPEND" ] && EXPORTS="${EXPORTS}export PATH=$PATH_PREPEND:\$PATH; "

MARKER=$(mktemp)
touch "$MARKER"
# launch_timeout, not a fixed bound: a cold pane can spend several seconds
# loading its shell environment before the codex command even runs, and
# both detection waits below share this one knob rather than exposing two.
LAUNCH_TIMEOUT="${launch_timeout:-120s}"
TIMEOUT_SECONDS="${LAUNCH_TIMEOUT%s}"
ATTEMPTS=$((TIMEOUT_SECONDS * 2))

# No `exec`: Codex runs as a child of the pane shell, so exiting Codex
# returns to the shell instead of closing the pane — which would otherwise
# tear down the whole tmux session out from under an attached user. The pane
# PID is therefore the shell, not Codex; its real PID is the matching child,
# found below (the same shape this plugin's claude effect uses to resolve its
# agent PID).
#
# The terminal verbs compose against whichever effect in this workflow
# declares the interactive endpoint — never a concrete multiplexer named
# here directly.
sh -c "$send_text" terminal-send-text "${EXPORTS}${CODEX_CMD}"
sh -c "$send_keys" terminal-send-keys Enter

PANE_PID=$(sh -c "$terminal_pid" terminal-pid)
PID=""
SID=""
for _ in $(seq 1 "$ATTEMPTS"); do
  sleep 0.5
  kill -0 "$PANE_PID" 2>/dev/null || continue
  for child in $(pgrep -P "$PANE_PID" 2>/dev/null); do
    COMM=$(ps -p "$child" -o comm= 2>/dev/null | tr -d '[:space:]')
    case "$COMM" in codex|codex-*) PID="$child"; break ;; esac
  done

  if [ -z "$PID" ]; then
    # No codex child under the pane yet — most likely this launch's Enter
    # was lost and the command line still sits unexecuted at the shell
    # prompt. Resend Enter and keep polling; once a codex child is found,
    # this branch stops being taken, so extra Enters stop reaching the pane
    # before codex's TUI has any input box to double-submit into.
    sh -c "$send_keys" terminal-send-keys Enter
    continue
  fi

  SID=$(find "$HOME/.codex/sessions" -type f -newer "$MARKER" -name '*.jsonl' 2>/dev/null \
    | while IFS= read -r file; do
        head -n 1 "$file" | jq -r --arg cwd "$workspace_dir" \
          'select(.type == "session_meta" and .payload.cwd == $cwd) | (.payload.session_id // empty)' 2>/dev/null
      done \
    | grep -E '^[0-9a-fA-F-]{36}$' \
    | tail -1)
  break
done
if [ -z "$PID" ]; then
  echo "codex not detected within ${TIMEOUT_SECONDS}s under pane pid $PANE_PID" >&2
  rm -f "$MARKER"
  # A launch that typed its command but never registered a matching child
  # can still be visibly alive in the pane (a lost Enter can leave codex
  # sitting on its own prompt, not the shell's). Leaving that process
  # running would trap the next `plect up`: its retry types a second launch
  # line into a pane that already holds a live codex, and the retry fails
  # the same way.
  for CHILD in $(pgrep -P "$PANE_PID" 2>/dev/null); do
    COMM=$(ps -p "$CHILD" -o comm= 2>/dev/null | tr -d '[:space:]')
    case "$COMM" in
      codex|codex-*)
        kill -TERM "$CHILD" 2>/dev/null
        for _ in 1 2 3 4 5; do
          sleep 0.5
          kill -0 "$CHILD" 2>/dev/null || break
        done
        kill -KILL "$CHILD" 2>/dev/null || true
        ;;
    esac
  done
  exit 1
fi
rm -f "$MARKER"

# A detected PID only means Codex has started, not that its TUI/MCP is done
# booting and can accept a submit. Delivering the initial instruction before
# that point types it into the input box without an Enter that actually
# submits, so it silently merges into whatever turn kicks the session later.
# Wait for the boot banner to clear and the prompt to hold steady across
# consecutive samples (not a fixed sleep, since MCP boot time varies) before
# declaring the effect produced.
READY_TIMEOUT_SECONDS="$TIMEOUT_SECONDS"
READY_ATTEMPTS=$((READY_TIMEOUT_SECONDS * 2))
STABLE_STREAK=0
STABLE_STREAK_REQUIRED=3
READY=0
for _ in $(seq 1 "$READY_ATTEMPTS"); do
  sleep 0.5
  PANE=$(sh -c "$capture" terminal-capture 2>/dev/null)
  if printf '%s' "$PANE" | grep -qE 'Booting MCP server|esc to interrupt'; then
    STABLE_STREAK=0
    continue
  fi
  STABLE_STREAK=$((STABLE_STREAK + 1))
  if [ "$STABLE_STREAK" -ge "$STABLE_STREAK_REQUIRED" ]; then
    READY=1
    break
  fi
done
if [ "$READY" -ne 1 ]; then
  echo "codex pid $PID detected but TUI not ready (boot banner / busy indicator still present) within ${READY_TIMEOUT_SECONDS}s" >&2
  # A detected-but-never-ready codex is still a live process a retry's
  # launch line would collide with, so it must go before this node fails.
  kill -TERM "$PID" 2>/dev/null
  for _ in 1 2 3 4 5; do
    sleep 0.5
    kill -0 "$PID" 2>/dev/null || break
  done
  kill -KILL "$PID" 2>/dev/null || true
  exit 1
fi

jq -nc \
  --argjson pid "$PID" \
  --arg sid "$SID" \
  --arg profile "$PROFILE_PATH" \
  '{pid:$pid, session_id:$sid, profile_path:$profile}'
'''

[codex.setup.bind]
session_name    = { from = "session.name" }
workspace_dir   = { from = "workspace.dir" }
model           = { from = "inputs.model", optional = true }
effort          = { from = "inputs.effort", optional = true }
launch_env      = { from = "inputs.launch_env", optional = true }
path_prepend    = { from = "inputs.path_prepend", optional = true }
launch_timeout  = { from = "inputs.launch_timeout", optional = true }
prev_session_id = { from = "prev.session_id", optional = true }
activity_bin    = { bin = "codex-agent-activity" }
capture         = { terminal = "capture" }
send_text       = { terminal = "send_text" }
send_keys       = { terminal = "send_keys" }
terminal_pid    = { terminal = "pid" }

[codex.cleanup]
type   = "shell"
script = '''
kill -TERM "$pid" 2>/dev/null || exit 0
for _ in 1 2 3 4 5; do
  sleep 0.5
  kill -0 "$pid" 2>/dev/null || break
done
kill -KILL "$pid" 2>/dev/null || true
# optional, not required: a session produced before this field existed has
# no such key, and a required projection of it would fail the release.
[ -n "${profile_path-}" ] && rm -f "$profile_path"
"$activity_bin" reset "$session_name"
true
'''

[codex.cleanup.bind]
pid          = { from = "self.outputs.pid", optional = true }
profile_path = { from = "self.outputs.profile_path", optional = true }
session_name = { from = "session.name" }
activity_bin = { bin = "codex-agent-activity" }

[codex.health.alive]
type   = "shell"
script = 'kill -0 "$pid"'

[codex.health.alive.bind]
pid = { from = "self.outputs.pid" }

# The turn-boundary hooks registered at setup are this effect's activity
# probe: the hook records each boundary and the probe reads the record back,
# so one plugin executable owns both halves. The probe withholds
# silence_expected while a turn is running and sets it once the turn ends,
# which is the only way a probe may narrow what core expects of this
# instance.
[codex.health.activity]
type = "exec"
bin  = "codex-agent-activity"
args = ["probe", { from = "session.name" }]

[codex.inputs_schema]
type                 = "object"
additionalProperties = false

# model/effort: restricted to a plain-token charset (no quotes, whitespace,
# or newlines) because they reach the pane's shell as keystrokes.
[codex.inputs_schema.properties]
model        = { type = "string", pattern = "^[A-Za-z0-9_.:-]*$" }
effort       = { type = "string", pattern = "^[A-Za-z0-9_.:-]*$" }
# launch_env: a JSON object. jq rejects anything that is not an object of
# scalars at launch time and quotes each value on its way into the
# keystrokes; the quote-free charset is the defense in depth behind that,
# since the keystrokes are a boundary the binding transport does not own.
launch_env   = { type = "string", pattern = "^[^']*$" }
# path_prepend: a plain path charset (no quotes, whitespace, or shell
# metacharacters), same reasoning as model/effort above.
path_prepend = { type = "string", pattern = "^[A-Za-z0-9_./:-]*$" }
# launch_timeout: restricted to digits-plus-"s" so the setup script can strip
# the suffix and use the result directly in shell arithmetic — no separate
# duration parser needed, and no non-numeric value can reach $(( )).
launch_timeout = { type = "string", pattern = "^[1-9][0-9]*s$" }

[codex.outputs_schema]
type     = "object"
required = ["pid", "session_id"]

[codex.outputs_schema.properties]
pid          = { type = "integer" }
session_id   = { type = "string" }
profile_path = { type = "string" }
