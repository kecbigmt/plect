# Auto-recreates missing pursue_goal instances for every open local-okf goal
# under the orchestrator workspace directory's knowledge/bundle/goals/. A
# pursue_goal instance is session-scoped, so a destroy→up cycle silently
# drops it and the tick reactor's heartbeat starves (nothing left to
# re-evaluate). scope="run" re-scans on every `up`.
#
# okf-goal task bootstrap checks for an existing instance before calling
# setup — not cleanup-then-setup — because an existing instance carries
# recorded judge history, and recreating it on every up would re-pend an
# already-satisfied judge for no reason. Only a genuinely missing instance
# is created.
[goal_bootstrap]
kind  = "effect"
scope = "run"

[goal_bootstrap.setup]
type = "exec"
bin  = "okf-goal"
args = [
  "task",
  "bootstrap",
  "--workspace-dir",
  { from = "workspace.dir" },
  "--owner",
  { from = "inputs.owner" },
  "--session",
  { from = "session.name" },
  "--assignees",
  { from = "inputs.assignees", default = "" },
]

# A scan-and-create sweep, not a surface of its own: the pursue_goal
# instances it creates are what would need re-checking, and each is its own
# session-scoped effect with its own liveness.
[goal_bootstrap.health.alive]
type = "noop"

[goal_bootstrap.inputs_schema]
type                 = "object"
required             = ["owner"]
additionalProperties = false

[goal_bootstrap.inputs_schema.properties]
owner = { type = "string" }
# assignees is a JSON array string of this orchestrator's own identity
# strings (`user:<login>` / `team:<slug>`, the same vocabulary a goal
# file's frontmatter `assignee` field uses). Empty/unset means the filter
# is inactive (opt-in, backward compatible): every open goal instantiates
# regardless of assignee.
assignees = { type = "string" }

[goal_bootstrap.outputs_schema]
type     = "object"
required = ["created"]

[goal_bootstrap.outputs_schema.properties.created]
type = "string"
