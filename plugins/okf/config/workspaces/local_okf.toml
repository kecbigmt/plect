# local-okf workspace provider: resolves `local-okf://<owner>/<concept-id>`
# into a session name and a read-context workspace over the owner's
# knowledge bundle. This is the dispatch-time counterpart to
# resources/okf_goal.toml's observe — same owner-alias resolution and
# bundle-containment checks, but here they gate workspace acquisition
# (`plect up` / `plect create --task`) instead of a status read, so a
# missing or unresolvable bundle fails the dispatch outright rather than
# folding into a resource-state field.

# The leading path segment(s) before the final `<slug>.md` are optional and
# unnamed, since the workspace provider is concept-kind agnostic (goals
# today, other OKF concepts later); resources/okf_goal.toml narrows the
# pattern to `goals/*.md` for the one concept kind this plugin currently
# understands.
[local_okf]
kind  = "workspace_provider"
match = '^local-okf://(?P<owner>[A-Za-z0-9][A-Za-z0-9-]*)/(?:[A-Za-z0-9._/-]*/)?(?P<slug>[A-Za-z0-9._-]+)\.md$'
name  = { expr = "match.owner + '/okf-' + match.slug" }

[local_okf.setup]
type = "exec"
bin  = "okf-bundle"
args = ["setup", "--resource", { from = "resource.id" }, "--session", { from = "session.name" }]

[local_okf.cleanup]
type = "exec"
bin  = "okf-bundle"
args = ["cleanup", "--workspace-dir", { from = "self.outputs.workspace_dir" }]

[local_okf.health.alive]
type   = "shell"
script = 'test -d "$workspace_dir"'

[local_okf.health.alive.bind]
workspace_dir = { from = "self.outputs.workspace_dir" }

[local_okf.outputs_schema]
type     = "object"
required = ["workspace_dir", "owner", "concept_id", "concept_path"]

[local_okf.outputs_schema.properties.workspace_dir]
type = "string"

[local_okf.outputs_schema.properties.owner]
type = "string"

[local_okf.outputs_schema.properties.concept_id]
type = "string"

[local_okf.outputs_schema.properties.concept_path]
type = "string"
